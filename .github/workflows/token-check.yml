name: Cloudflare token check

# Read-only. Probes each permission the deployment token needs and prints pass or fail per capability. It never prints the token, and it changes nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'virtualpredictor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe each capability
        run: |
          set -u
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "no token configured"; exit 1; }
          # Shape of the stored value only: length, public prefix and stray characters. The value itself is never printed.
          node -e "const t=process.env.CLOUDFLARE_API_TOKEN;const m=t.match(/^(cf[a-z]{2})_/);console.log('stored value: length',t.length,'| prefix',m?m[1]+'_':'(none recognised)','| leading/trailing whitespace',t!==t.trim()?'YES':'no','| contains whitespace inside',/\\s/.test(t.trim())?'YES':'no','| non-ASCII characters',/[^ -~]/.test(t)?'YES':'no')"
          A="https://api.cloudflare.com/client/v4"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          probe() { # name url
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "$H" "$2")
            ok=$(node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/r.json','utf8'));console.log(j.success===true?'pass':'FAIL '+(j.errors&&j.errors[0]?('code '+j.errors[0].code+' '+String(j.errors[0].message).slice(0,60)):''))}catch(e){console.log('FAIL unreadable')}")
            echo "$1: HTTP $code -> $ok"
          }
          probe "token valid (account token verify)" "$A/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          probe "token valid (user token verify)" "$A/user/tokens/verify"
          probe "Workers Scripts (read of the permission you granted as Edit)" "$A/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          probe "Workers R2 Storage" "$A/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets"
          probe "D1" "$A/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          code=$(curl -s -o /tmp/g.json -w '%{http_code}' -X POST -H "$H" -H 'Content-Type: application/json' "$A/graphql" --data "{\"query\":\"query { viewer { accounts(filter:{accountTag:\\\"$CLOUDFLARE_ACCOUNT_ID\\\"}) { accountTag } } }\"}")
          node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/g.json','utf8'));console.log('Account Analytics (GraphQL): HTTP '+process.argv[1]+' -> '+((j.data&&j.data.viewer&&j.data.viewer.accounts&&j.data.viewer.accounts.length)?'pass':'FAIL '+(j.errors&&j.errors[0]?String(j.errors[0].message).slice(0,70):'no account visible')))}catch(e){console.log('Account Analytics (GraphQL): FAIL unreadable')}" "$code"
