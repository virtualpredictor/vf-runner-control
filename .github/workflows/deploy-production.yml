name: Deploy production (gated)

# PRODUCTION: https://ai.virtualpredictor.workers.dev/ (Worker "ai"). Needs the owner's separate explicit approval for every run:
#   * only the repository owner can dispatch it, and the job waits in the "production" environment for the required reviewer;
#   * a typed confirmation is required;
#   * it refuses to run while ci/production/wrangler.jsonc in the pinned vf-core commit still has a __PLACEHOLDER__, declares any route
#     or custom domain, or binds a staging resource.
# action=deploy   builds the public site, applies the D1 schema, deploys the pinned commit, sets the Worker's publish key, then runs
#                 smoke tests. If they fail it rolls back to the version that was live before, automatically.
# action=rollback rolls back to the given Worker version id, then runs the same smoke tests.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy or rollback"
        required: true
        type: choice
        options: [deploy, rollback]
      core_sha:
        description: "vf-core commit to deploy (full 40-char SHA; required for deploy)"
        required: false
        type: string
      version_id:
        description: "Worker version id to roll back to (required for rollback)"
        required: false
        type: string
      confirm:
        description: "Type DEPLOY TO PRODUCTION to continue"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'virtualpredictor' && inputs.confirm == 'DEPLOY TO PRODUCTION'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE: https://ai.virtualpredictor.workers.dev
      ACTION: ${{ inputs.action }}
      CORE_SHA: ${{ inputs.core_sha }}
      VERSION_ID: ${{ inputs.version_id }}
    steps:
      - name: Check the inputs and the token configuration
        run: |
          set -eu
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "Cloudflare token or account id missing"; exit 1; }
          if [ "$ACTION" = "deploy" ]; then printf '%s' "$CORE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "core_sha must be a full 40-char SHA"; exit 1; }; fi
          if [ "$ACTION" = "rollback" ]; then printf '%s' "$VERSION_ID" | grep -Eq '^[0-9a-f-]{36}$' || { echo "version_id must be a Worker version id"; exit 1; }; fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: Private-source checkout (pinned commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: virtualpredictor/vf-core
          ref: ${{ inputs.action == 'deploy' && inputs.core_sha || 'phase0/remediation' }}
          ssh-key: ${{ secrets.VF_CORE_DEPLOY_KEY }}
          path: vf-core
          persist-credentials: false

      - name: Verify the token sees exactly the project account
        run: |
          set -u
          A="https://api.cloudflare.com/client/v4"; H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -H "$H" "$A/user/tokens/verify" -o /tmp/v.json
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/v.json','utf8'));process.exit(j.success===true&&j.result.status==='active'?0:1)" || { echo "token verify failed"; exit 1; }
          curl -sS -H "$H" "$A/accounts" -o /tmp/a.json
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/a.json','utf8'));const ids=(j.result||[]).map(a=>a.id);process.exit(ids.length===1&&ids[0]===process.env.CLOUDFLARE_ACCOUNT_ID?0:1)" || { echo "token sees other accounts, or not this one; refusing"; exit 1; }

      - name: Refuse an unfinished or unsafe production configuration
        working-directory: vf-core
        run: |
          set -eu
          C=ci/production/wrangler.jsonc
          ! grep -q '__[A-Z0-9_]*__' "$C" || { echo "production config still has placeholders: create the production resources first"; exit 1; }
          grep -q '"name": "ai"' "$C" || { echo "production Worker must be named ai"; exit 1; }
          ! grep -Eq '"routes"|"route"|custom_domain' "$C" || { echo "no routes or custom domain allowed"; exit 1; }
          ! grep -Eq 'vf-phase0|8d851a91-140e-4139-ae07-a07e436fac6d' "$C" || { echo "production must not bind a staging resource"; exit 1; }

      - name: Record the version that is live now (for automatic rollback)
        working-directory: vf-core
        run: |
          set -o pipefail
          npx --yes wrangler@4.157.0 deployments list --config ci/production/wrangler.jsonc --json > /tmp/deployments.json 2>/dev/null || echo "[]" > /tmp/deployments.json
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/deployments.json','utf8'));const last=[].concat(d).filter(Boolean).pop();const v=last&&last.versions&&last.versions[0]&&last.versions[0].version_id;console.log('previous version:',v||'none');require('fs').writeFileSync('/tmp/prev_version',v||'')"

      - name: Build the public site
        if: inputs.action == 'deploy'
        working-directory: vf-core
        run: node ci/build_site.js

      - name: Deploy
        if: inputs.action == 'deploy'
        working-directory: vf-core
        env:
          PUBLISH_KEY: ${{ secrets.VF_PROD_PUBLISH_KEY }}
        run: |
          set -euo pipefail
          [ -n "$PUBLISH_KEY" ] || { echo "VF_PROD_PUBLISH_KEY is not configured"; exit 1; }
          npx --yes wrangler@4.157.0 d1 execute vf-prod --remote --file ci/staging-app/schema.sql --config ci/production/wrangler.jsonc
          npx --yes wrangler@4.157.0 deploy --config ci/production/wrangler.jsonc
          printf '%s' "$PUBLISH_KEY" | npx --yes wrangler@4.157.0 secret put PUBLISH_KEY --config ci/production/wrangler.jsonc

      - name: Roll back to the requested version
        if: inputs.action == 'rollback'
        working-directory: vf-core
        run: npx --yes wrangler@4.157.0 rollback "$VERSION_ID" --config ci/production/wrangler.jsonc --message "manual rollback" --yes

      - name: Smoke tests
        id: smoke
        run: |
          set -u
          sleep 8
          fail=0
          check() { code=$(curl -s -o /tmp/body -w '%{http_code}' "$SITE$1"); case " $2 " in *" $code "*) echo "PASS $1 -> $code";; *) echo "FAIL $1 -> $code (expected $2)"; fail=1;; esac; }
          check / "200"; grep -q 'name="vf-accounts" content="off"' /tmp/body || { echo "FAIL / is not the accounts-off site"; fail=1; }
          check /about/ "200"
          check /blog/ "200"
          check /login/ "404"
          check /dashboard/ "404"
          check /data/history.json "404"
          check /no-such-page "404"
          check /_health "200"
          check "/free-picks/?bookmaker=sportybet" "200 503"
          check "/free-picks/?bookmaker=betpawa" "200 503"
          exit $fail

      - name: Automatic rollback when the smoke tests fail after a deploy
        if: failure() && inputs.action == 'deploy' && steps.smoke.outcome == 'failure'
        working-directory: vf-core
        run: |
          PREV=$(cat /tmp/prev_version 2>/dev/null || true)
          if [ -n "$PREV" ]; then npx --yes wrangler@4.157.0 rollback "$PREV" --config ci/production/wrangler.jsonc --message "automatic rollback after failed smoke tests" --yes; echo "rolled back to $PREV"; else echo "no previous version recorded; roll back by hand"; fi
          exit 1
