name: R2 quota guard

# Hourly read-only check of month-to-date R2 usage against the free allowance (1M Class A, 10M Class B operations).
#   >= 50 % : warns.   >= 70 % : stops publishing (purges the public snapshot objects) and turns the public R2 URL off.
# Re-enabling is a manual decision. With no CLOUDFLARE_API_TOKEN configured the guard prints "unconfigured" and does nothing.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      simulate_pct:
        description: "Drill: pretend usage is this percent of the free allowance (55 exercises the warning, 75 the suspension of the idle staging bucket). Empty = real usage."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: quota-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      APP_URL: https://vf-phase0-app-staging.virtualpredictor.workers.dev
      R2_BUCKET: vf-phase0-r2-test
      PUBLISH_KEY: ${{ secrets.VF_STAGING_PUBLISH_KEY }}
      QUOTA_SIMULATE_PCT: ${{ inputs.simulate_pct }}
    steps:
      - name: Is the guard configured?
        id: cfg
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; echo "unconfigured: no Cloudflare API token yet"; fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        if: steps.cfg.outputs.configured == 'true'
        with:
          node-version: "22"

      - name: Private-source checkout (the policy script lives in vf-core)
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: virtualpredictor/vf-core
          ref: phase0/remediation
          ssh-key: ${{ secrets.VF_CORE_DEPLOY_KEY }}
          path: vf-core
          persist-credentials: false

      - name: Check usage and apply the policy
        if: steps.cfg.outputs.configured == 'true'
        working-directory: vf-core
        run: |
          set -o pipefail
          node ci/quota_guard.js | tee "$GITHUB_STEP_SUMMARY"
