name: Phase 0 Cloud Suite

# Manual dispatch only: no pull_request, pull_request_target or push triggers, so untrusted code can never reach the
# secrets below. Only the repository owner can dispatch it.
#
# mode=smoke  private-source checkout check only (one short job). Nothing else runs.
# mode=preflight  checkout + real-provider source check only (about 5 minutes); no tests run.
# mode=full   the same checkout check, then (only if it passed) Test A and Test B back to back on one runner.
#             Both tests use real provider data only: if a provider is unreachable the run reports the source failure
#             and stops, and no synthetic data is ever counted as a provider test.
#
# The application source is in the private vf-core repository and is fetched read-only at one pinned commit with a
# deploy key. It is never printed, never uploaded as an artifact and never copied into this public repository.

on:
  workflow_dispatch:
    inputs:
      core_sha:
        description: "Pinned vf-core commit (full 40-char SHA)"
        required: true
        type: string
      dispatched_at_ms:
        description: "Epoch milliseconds when the run was dispatched (runner startup measurement)"
        required: true
        type: string
      mode:
        description: "smoke = checkout check only, preflight = checkout + real-provider source check, full = everything"
        required: false
        default: "smoke"
        type: choice
        options: [smoke, preflight, full]
      a_minutes:
        description: "Test A duration in minutes (full mode)"
        required: false
        default: "60"
        type: string
      b_minutes:
        description: "Test B duration in minutes (full mode)"
        required: false
        default: "90"
        type: string
      d_scale:
        description: "Test D (R2 capacity scenarios) duration scale, 1 = full (about 50 minutes)"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: phase0-cloud-suite
  cancel-in-progress: false

jobs:
  checkout-smoke:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'virtualpredictor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CORE_SHA: ${{ inputs.core_sha }}
    steps:
      - name: Validate the pinned commit input
        run: |
          set -euo pipefail
          printf '%s' "$CORE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "core_sha must be a full 40-char lowercase hex SHA"; exit 1; }

      - name: Private-source checkout (read-only deploy key), attempt 1
        id: co1
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: virtualpredictor/vf-core
          ref: ${{ inputs.core_sha }}
          ssh-key: ${{ secrets.VF_CORE_DEPLOY_KEY }}
          path: vf-core
          persist-credentials: false

      - name: Pause before retry
        if: steps.co1.outcome == 'failure'
        run: sleep 25

      - name: Private-source checkout, attempt 2
        id: co2
        if: steps.co1.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: virtualpredictor/vf-core
          ref: ${{ inputs.core_sha }}
          ssh-key: ${{ secrets.VF_CORE_DEPLOY_KEY }}
          path: vf-core
          persist-credentials: false

      - name: Pause before retry
        if: steps.co1.outcome == 'failure' && steps.co2.outcome == 'failure'
        run: sleep 25

      - name: Private-source checkout, attempt 3
        id: co3
        if: steps.co1.outcome == 'failure' && steps.co2.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: virtualpredictor/vf-core
          ref: ${{ inputs.core_sha }}
          ssh-key: ${{ secrets.VF_CORE_DEPLOY_KEY }}
          path: vf-core
          persist-credentials: false

      - name: Require a successful checkout
        run: |
          echo "attempts: 1=${{ steps.co1.outcome }} 2=${{ steps.co2.outcome }} 3=${{ steps.co3.outcome }}"
          [ "${{ steps.co1.outcome }}" = "success" ] || [ "${{ steps.co2.outcome }}" = "success" ] || [ "${{ steps.co3.outcome }}" = "success" ]

      - name: Verify commit, privacy and checkout result (sanitized)
        run: |
          set -euo pipefail
          GOT="$(git -C vf-core rev-parse HEAD)"
          [ "$GOT" = "$CORE_SHA" ] || { echo "FAIL: checked out $GOT, expected $CORE_SHA"; exit 1; }
          # Privacy: an anonymous request must not be able to see the repository (GitHub answers 404 for private repos)
          ANON="$(curl -s -o /dev/null -w '%{http_code}' https://github.com/virtualpredictor/vf-core)"
          API="$(curl -s -o /dev/null -w '%{http_code}' https://api.github.com/repos/virtualpredictor/vf-core)"
          FILES="$(git -C vf-core ls-files | wc -l)"
          {
            echo "## Private-source checkout smoke test"
            echo ""
            echo "| check | result |"
            echo "|---|---|"
            echo "| checkout step | success |"
            echo "| commit SHA | \`$GOT\` |"
            echo "| matches pinned input | yes |"
            echo "| tracked files (count only) | $FILES |"
            echo "| anonymous web request | HTTP $ANON (404 = private) |"
            echo "| anonymous API request | HTTP $API (404 = private) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$ANON" = "404" ] && [ "$API" = "404" ] || { echo "FAIL: repository is reachable anonymously"; exit 1; }

      - name: Remove the private checkout from the runner
        if: always()
        run: rm -rf vf-core

  suite:
    if: inputs.mode == 'full' || inputs.mode == 'preflight'
    needs: checkout-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CORE_SHA: ${{ inputs.core_sha }}
      A_MINUTES: ${{ inputs.a_minutes }}
      B_MINUTES: ${{ inputs.b_minutes }}
      D_SCALE: ${{ inputs.d_scale }}
      APP_URL: https://vf-phase0-app-staging.virtualpredictor.workers.dev
      LOCAL_BASE: http://localhost:8787
      SNAPSHOT_BASE: https://pub-3ddeb4280145459d9e18b30b357e4403.r2.dev/v1/
      CONTROL_DIR: ${{ github.workspace }}/control
      OUT_DIR: ${{ github.workspace }}/out
    steps:
      - name: Record runner start
        env:
          DISPATCHED_AT_MS: ${{ inputs.dispatched_at_ms }}
        run: |
          mkdir -p "$OUT_DIR"
          START_MS=$(date +%s%3N)
          echo "SUITE_START_MS=$START_MS" >> "$GITHUB_ENV"
          echo "RUN_ID=$(date -u +%Y%m%dT%H%M%SZ)-${{ github.run_id }}" >> "$GITHUB_ENV"
          node -e "console.log(JSON.stringify({runner_start_delay_ms: Number(process.argv[1]) - Number(process.argv[2]), runner_image: process.env.ImageVersion||null, runner_os: process.env.RUNNER_OS}))" "$START_MS" "$DISPATCHED_AT_MS" | tee "$OUT_DIR/suite_startup.json"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: Private-source checkout (read-only deploy key), attempt 1
        id: co1
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: virtualpredictor/vf-core
          ref: ${{ inputs.core_sha }}
          ssh-key: ${{ secrets.VF_CORE_DEPLOY_KEY }}
          path: vf-core
          persist-credentials: false

      - name: Pause before retry
        if: steps.co1.outcome == 'failure'
        run: sleep 25

      - name: Private-source checkout, attempt 2
        id: co2
        if: steps.co1.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: virtualpredictor/vf-core
          ref: ${{ inputs.core_sha }}
          ssh-key: ${{ secrets.VF_CORE_DEPLOY_KEY }}
          path: vf-core
          persist-credentials: false

      - name: Pause before retry
        if: steps.co1.outcome == 'failure' && steps.co2.outcome == 'failure'
        run: sleep 25

      - name: Private-source checkout, attempt 3
        id: co3
        if: steps.co1.outcome == 'failure' && steps.co2.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: virtualpredictor/vf-core
          ref: ${{ inputs.core_sha }}
          ssh-key: ${{ secrets.VF_CORE_DEPLOY_KEY }}
          path: vf-core
          persist-credentials: false

      - name: Require a successful checkout
        run: |
          echo "attempts: 1=${{ steps.co1.outcome }} 2=${{ steps.co2.outcome }} 3=${{ steps.co3.outcome }}"
          [ "${{ steps.co1.outcome }}" = "success" ] || [ "${{ steps.co2.outcome }}" = "success" ] || [ "${{ steps.co3.outcome }}" = "success" ]

      - name: Verify the pinned commit and drop git metadata
        run: |
          set -euo pipefail
          [ "$(git -C vf-core rev-parse HEAD)" = "$CORE_SHA" ] || { echo "pinned commit mismatch"; exit 1; }
          rm -rf vf-core/.git
          echo "source ready at $CORE_SHA"

      - name: Install Playwright and headless Chromium
        run: |
          set -euo pipefail
          mkdir -p pw && cd pw
          npm init -y >/dev/null
          npm install --silent playwright@1.49.1
          npx playwright install --with-deps chromium >/dev/null
          echo "NODE_PATH=$PWD/node_modules" >> "$GITHUB_ENV"

      - name: Start the application server in real-data-only mode
        working-directory: vf-core
        env:
          VF_REAL_DATA_ONLY: "1"
          VIRTUSTEC_HW_ID: ${{ secrets.VIRTUSTEC_HW_ID }}
        run: |
          set -euo pipefail
          nohup node server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -H "cookie: wv_session=wv_permanent_demo_token" "$LOCAL_BASE/api/round?bookmaker=sportybet"; then echo "server up after ${i}s"; break; fi
            sleep 1
          done

      - name: Source preflight (real provider data only; stops the suite if unavailable)
        working-directory: vf-core/ci
        run: node source_preflight.js

      - name: Field-level inspection gate (nothing is published unless this passes)
        id: inspect
        continue-on-error: true
        working-directory: vf-core/ci
        env:
          VIRTUSTEC_HW_ID: ${{ secrets.VIRTUSTEC_HW_ID }}
          PUBLISH_KEY: ${{ secrets.VF_STAGING_PUBLISH_KEY }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
        run: node inspect_snapshot.js

      - name: Upload checkpoint artifact (stage 1; metrics only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: phase0-stage1-preflight-inspection-${{ github.run_id }}
          path: |
            out/source_preflight.json
            out/field_inspection.json
            out/suite_startup.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Test C - regression and integrity (API, prices, fail-closed, frontend, signed ingestion)
        id: test_c
        if: inputs.mode == 'full'
        continue-on-error: true
        working-directory: vf-core/ci
        env:
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
        run: |
          date +%s%3N > "$OUT_DIR/testC_started_ms"
          node test_c_regression.js
          date +%s%3N > "$OUT_DIR/testC_finished_ms"

      - name: Upload checkpoint artifact (Test C; metrics only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: phase0-stage1b-testC-${{ github.run_id }}
          path: |
            out/testC_*
            out/testC*_ms
          if-no-files-found: ignore
          retention-days: 90

      - name: Test A - browser correctness (local server, headless Chromium)
        id: test_a
        if: inputs.mode == 'full'
        continue-on-error: true
        working-directory: vf-core/ci
        run: |
          date +%s%3N > "$OUT_DIR/testA_started_ms"
          node test_a_history_60min.js
          date +%s%3N > "$OUT_DIR/testA_finished_ms"

      - name: Upload checkpoint artifact (Test A; metrics only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: phase0-stage2-testA-${{ github.run_id }}
          path: |
            out/testA_*
            out/testA*_ms
          if-no-files-found: ignore
          retention-days: 90

      - name: Check staging Worker
        if: inputs.mode == 'full' && steps.inspect.outcome == 'success'
        run: |
          set -euo pipefail
          curl -fsS "$APP_URL/_health" | head -c 300; echo

      - name: Test B - integrated staging run (publisher + browsers)
        id: test_b
        if: inputs.mode == 'full' && steps.inspect.outcome == 'success'
        continue-on-error: true
        working-directory: vf-core/ci
        env:
          PUBLISH_KEY: ${{ secrets.VF_STAGING_PUBLISH_KEY }}
        run: |
          set +e; set -u
          date +%s%3N > "$OUT_DIR/testB_started_ms"
          mkdir -p "$CONTROL_DIR"
          export PUBLISH_LOG="$OUT_DIR/publish_${RUN_ID}_log.jsonl"
          PUBLISH_MINUTES=$(( B_MINUTES + 6 )) PUBLISH_INTERVAL_S=30 node publish_snapshot.js &
          PUB=$!
          sleep 20
          node test_b_staging.js
          RC=$?
          kill "$PUB" 2>/dev/null || true
          date +%s%3N > "$OUT_DIR/testB_finished_ms"
          exit $RC

      - name: Upload checkpoint artifact (Test B; metrics only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: phase0-stage3-testB-${{ github.run_id }}
          path: |
            out/testB_*
            out/publish_*
            out/testB*_ms
          if-no-files-found: ignore
          retention-days: 90

      - name: Test D - R2 read rates per visitor scenario (publisher + fresh browsers)
        id: test_d
        if: inputs.mode == 'full' && steps.inspect.outcome == 'success'
        continue-on-error: true
        working-directory: vf-core/ci
        env:
          PUBLISH_KEY: ${{ secrets.VF_STAGING_PUBLISH_KEY }}
        run: |
          set +e; set -u
          date +%s%3N > "$OUT_DIR/testD_started_ms"
          export PUBLISH_LOG="$OUT_DIR/publish_D_${RUN_ID}_log.jsonl"
          PUBLISH_MINUTES=$(( 62 )) PUBLISH_INTERVAL_S=30 node publish_snapshot.js &
          PUB=$!
          sleep 60
          node test_d_capacity.js
          RC=$?
          kill "$PUB" 2>/dev/null || true
          date +%s%3N > "$OUT_DIR/testD_finished_ms"
          exit $RC

      - name: Capacity table from the measured scenario rates
        if: always() && inputs.mode == 'full'
        working-directory: vf-core/ci
        run: |
          D=$(ls "$OUT_DIR"/testD_*_results.json 2>/dev/null | head -1)
          P=$(ls "$OUT_DIR"/publish_D_*_log.jsonl 2>/dev/null | head -1)
          [ -n "$D" ] && node capacity_model.js "$D" "$P" | tee "$OUT_DIR/capacity_table.md" || echo "no Test D results"

      - name: R2 quota policy check (read-only dry run)
        if: always() && inputs.mode == 'full'
        working-directory: vf-core/ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node quota_guard.js --dry-run | tee "$OUT_DIR/quota_policy_check.json"

      - name: Upload checkpoint artifact (Test D and capacity; metrics only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: phase0-stage4-testD-${{ github.run_id }}
          path: |
            out/testD_*
            out/publish_D_*
            out/capacity_table.md
            out/quota_policy_check.json
            out/testD*_ms
          if-no-files-found: ignore
          retention-days: 90

      - name: Cleanup - revoke the public snapshot objects (does not need any Cloudflare login)
        if: always() && inputs.mode == 'full'
        working-directory: vf-core/ci
        env:
          PUBLISH_KEY: ${{ secrets.VF_STAGING_PUBLISH_KEY }}
        run: node revoke.js | tee "$OUT_DIR/cleanup_revoke.json"

      - name: Sanitized summary
        if: always()
        run: |
          node vf-core/ci/summarize.js "$OUT_DIR" >> "$GITHUB_STEP_SUMMARY" || true
          echo "server error lines: $(grep -ci error "$RUNNER_TEMP/server.log" 2>/dev/null || echo 0)" >> "$OUT_DIR/server_error_count.txt"
          echo "total_suite_seconds=$(( ($(date +%s%3N) - SUITE_START_MS) / 1000 ))" | tee "$OUT_DIR/suite_total.txt"

      - name: Upload evidence (metrics and logs only; no secrets, no source)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: phase0-evidence-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 90

      - name: Fail the run if either test failed
        if: always() && inputs.mode == 'full'
        run: |
          echo "inspection=${{ steps.inspect.outcome }} test_c=${{ steps.test_c.outcome }} test_a=${{ steps.test_a.outcome }} test_b=${{ steps.test_b.outcome }} test_d=${{ steps.test_d.outcome }}"
          [ "${{ steps.inspect.outcome }}" = "success" ] && [ "${{ steps.test_c.outcome }}" = "success" ] && [ "${{ steps.test_a.outcome }}" = "success" ] && [ "${{ steps.test_b.outcome }}" = "success" ] && [ "${{ steps.test_d.outcome }}" = "success" ]
